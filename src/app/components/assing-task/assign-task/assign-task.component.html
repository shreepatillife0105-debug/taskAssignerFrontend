<div class="container">
  <h2>Assign New Task</h2>

  <div *ngIf="message" [class.success]="isSuccess" [class.error]="!isSuccess" class="message">
    {{ message }}
  </div>

  <form (ngSubmit)="assignTask()">
    <div class="form-group">
      <label>Task Title</label>
      <input type="text" [(ngModel)]="task.title" name="title" required placeholder="Enter task title">
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea [(ngModel)]="task.description" name="description" rows="4" required
                placeholder="Enter detailed description"></textarea>
    </div>

    <div class="form-group">
      <label>Select Intern</label>
      <select [(ngModel)]="task.internId" name="internId" required>
        <option [ngValue]="0" disabled>Select an intern</option>
        <option *ngFor="let intern of interns" [ngValue]="intern.id">
          {{ intern.name }} ({{ intern.email }})
        </option>
      </select>
    </div>

    <button type="submit">Assign Task & Send Email</button>
  </form>
</div>
